#
# Used to test the hosts-entry action.
#

name: Amend Hosts

on:
  push:
    branches:
      - dev

jobs:
  amend-hosts:
    name: Amend hosts
    runs-on: ubuntu-latest
    steps:

      # Checkout the repository - this is required because the action is local.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Amend hosts file (ip)
        uses: ./hosts-entry
        with:
          comment: "Custom hosts entry (ip)"
          host: example.local
          ip: 127.0.0.2

      - name: Amend hosts file (cname)
        uses: ./hosts-entry
        with:
          comment: "Custom hosts entry (cname)"
          host: example.local
          cname: example.com

      - name: Print hosts file
        run: cat /etc/hosts
